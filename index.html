<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سنڌي مزا - وڊيو ٺاهيو</title>
<style>
body{font-family:system-ui;background:#0f2a1d;color:#fff;margin:0}
header{text-align:center;padding:22px;background:linear-gradient(135deg,#0f5132,#c9a227)}
main{max-width:640px;margin:auto;padding:14px}
.card{background:#fff;color:#222;border-radius:14px;padding:16px;margin:12px 0}
.tab{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
.tab.active{background:#0f5132;color:#fff}
.tabs{display:flex;gap:8px}
textarea,input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
.price-card{flex:1;border:2px solid #ddd;border-radius:12px;padding:12px;display:flex;flex-direction:column;cursor:pointer}
.bill{font-size:20px;text-align:center;background:#fff3cd;padding:10px;border-radius:10px}
.pay,.submit{width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}
.pay{background:#e40000;color:#fff}
.submit{background:#0f5132;color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>سنڌي مزا</h1><p>پنهنجي وڊيو ٺاهيو</p></header>
<main>
<div class="tabs">
<button id="tabText" class="tab active" onclick="switchTab('text')">لکي وڊيو ٺاهيو</button>
<button id="tabPhoto" class="tab" onclick="switchTab('photo')">فوٽو مان وڊيو ٺاهيو</button>
</div>
<div id="textBox" class="card">
<label>توهان جو خيال لکو:</label>
<textarea id="prompt" placeholder="مثال: سنڌي ڇوڪرو اجرڪ ۽ ٽوپي ۾ کلندي"></textarea>
</div>
<div id="photoBox" class="card hidden">
<label>پنهنجو فوٽو چونڊيو:</label>
<input type="file" id="photo" accept="image/*">
<textarea id="photoPrompt" placeholder="مثال: هن کي کلايو"></textarea>
</div>
<div class="card">
<label>وڊيو چونڊيو - رڳو هڪ ئي قيمت:</label>
<div style="display:flex;gap:10px">
<label class="price-card"><input type="radio" name="quality" value="90" checked onchange="updateBill()"><b>سادي وڊيو</b><span>90 رپيا</span></label>
<label class="price-card"><input type="radio" name="quality" value="180" onchange="updateBill()"><b>شاندار وڊيو</b><span>180 رپيا</span></label>
</div>
<div class="bill">بل: <b id="bill">90 رپيا</b></div>
</div>
<div class="card">
<h3>پئسا موڪليو - جيز ڪيش</h3>
<p>نمبر هتي نظر نه ايندو. بٽڻ دٻائي پئسا موڪليو، پوءِ TID لکو.</p>
<button class="pay" onclick="alert('جيز ڪيش صفحو کلي رهيو آهي...')">جيز ڪيش تي پئسا موڪليو</button>
<input type="text" id="tid" placeholder="جيز ڪيش TID لکو" style="margin-top:10px">
<button class="submit" onclick="submitOrder()">آرڊر موڪليو</button>
<div id="msg"></div>
</div>
<div class="card"><h3>منهنجا آرڊر</h3><div id="orders"></div></div>
</main>
<script>
let mode='text';
function switchTab(m){mode=m;document.getElementById('tabText').classList.toggle('active',m==='text');document.getElementById('tabPhoto').classList.toggle('active',m==='photo');document.getElementById('textBox').classList.toggle('hidden',m!=='text');document.getElementById('photoBox').classList.toggle('hidden',m!=='photo');}
function getPrice(){return document.querySelector('input[name="quality"]:checked').value;}
function updateBill(){document.getElementById('bill').innerText=getPrice()+' رپيا';}
function submitOrder(){const tid=document.getElementById('tid').value.trim();if(!tid){alert('TID لکو');return;}const o={id:'SM-'+Date.now().toString().slice(-6),mode,price:getPrice(),tid,status:'Approval Pending'};const all=JSON.parse(localStorage.getItem('sindhi_orders')||'[]');all.unshift(o);localStorage.setItem('sindhi_orders',JSON.stringify(all));document.getElementById('msg').innerHTML='<b style="color:green">آرڊر ملي ويو!</b>';renderOrders();}
function renderOrders(){const all=JSON.parse(localStorage.getItem('sindhi_orders')||'[]');document.getElementById('orders').innerHTML=all.length?all.map(o=>`<div style="border:1px solid #ddd;padding:10px;border-radius:10px;margin:6px 0"><b>${o.id}</b> - ${o.price} رپيا - TID:${o.tid} - ${o.status}</div>`).join(''):'اڃا ڪو آرڊر ناهي';}
renderOrders();
</script>
</body>
</html>
