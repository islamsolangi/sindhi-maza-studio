@keyframes revealPop {
  0% {
    opacity: 0;
    transform: scale(.72) translateY(4px);
    filter: blur(4px);
  }

  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
    filter: blur(0);
  }
}

@keyframes floatSoft {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-5px);
  }
}

@keyframes shimmerLine {
  0% {
    transform: translateX(110%);
  }

  100% {
    transform: translateX(-110%);
  }
}

@keyframes pulseAi {
  0% {
    box-shadow: 0 0 0 0 rgba(168,85,247,.55);
  }

  100% {
    box-shadow: 0 0 0 14px rgba(168,85,247,0);
  }
}

@keyframes gradientFlow {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

@keyframes glowPulse {
  0%, 100% {
    opacity: .55;
  }

  50% {
    opacity: 1;
  }
}

.reveal-pop {
  animation: revealPop .38s cubic-bezier(.2,.9,.3,1.3) both;
}

.float-soft {
  animation: floatSoft 3.2s ease-in-out infinite;
}

.pulse-ai {
  animation: pulseAi 1.6s ease-out infinite;
}

.ai-animated {
  background-size: 220% 220%;
  animation: gradientFlow 7s ease-in-out infinite;
}

.ai-glow {
  animation: glowPulse 3s ease-in-out infinite;
}

.ai-strip {
  background: linear-gradient(90deg, #7C3AED, #A855F7, #3B82F6, #06B6D4, #EC4899, #A855F7);
  background-size: 220% 100%;
  animation: gradientFlow 6s ease-in-out infinite;
}

.ai-gradient-text {
  background: linear-gradient(90deg, #C084FC, #60A5FA, #22D3EE, #F472B6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.glass {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(14px);
}

.glass-strong {
  background: rgba(23,23,47,.82);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(16px);
}

.shimmer-wrap {
  position: relative;
  overflow: hidden;
}

.shimmer-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  width: 45%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
  animation: shimmerLine 2.2s infinite;
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

.no-scrollbar {
  scrollbar-width: none;
}
