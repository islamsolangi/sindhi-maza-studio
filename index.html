<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sindhi Maza</title>
<style>body{font-family:Arial;margin:0}.banner{background:repeating-linear-gradient(45deg,#d32f2f 0 25px,#2e7d32 25px 50px);text-align:center;padding:18px;font-size:34px;color:#fff}.box{padding:0 16px}input{width:100%;padding:16px;border:3px solid #111;border-radius:28px;font-size:17px}button{padding:18px;border:none;border-radius:16px;color:#fff;font-size:19px;font-weight:bold}video{width:100%;border-radius:12px;margin-top:10px}</style>
</head>
<body>
<div class="banner">سنڌي مزا ❤️💚</div>
<div class="box">
<input id="prompt" placeholder="Sindhi boy near Sindh River...">
<br><br>
<button style="background:#e53935;width:100%" onclick="makeVideo()">✨ Text to Video</button>
<div id="result" style="display:none;margin-top:14px;background:#111;color:#fff;padding:14px;border-radius:14px;text-align:center">
<b id="rtext"></b><p id="rload"></p>
<video id="vid" controls playsinline style="display:none"></video>
</div>
</div>

<script>
// 👇👇 هي آهي makeVideo واري جڳھ - هتي آهي!
async function makeVideo(){
  let p = document.getElementById('prompt').value || 'Sindhi boy near Sindh River';
  document.getElementById('result').style.display='block';
  document.getElementById('rtext').innerText='🎬 '+p;
  document.getElementById('rload').innerText='Sora AI وڊيو ٺاهي رهي آهي... 1-2 منٽ لڳندا...';
  let res = await fetch('/api/generate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prompt:p}) });
  if(!res.ok){ ... 'Error: Balance يا Key' }
  let blob = await res.blob();
  let url = URL.createObjectURL(blob);
  let v = document.getElementById('vid');
  v.style.display='block'; v.src=url; v.play();
  document.getElementById('rload').innerText='✅ اصل AI وڊيو تيار آهي!';
}
</script>
</body>
</html>
