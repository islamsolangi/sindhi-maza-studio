<!DOCTYPE html>
<html lang="sd">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sindhi Maza Studio - Gemini AI</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#0f0f0f;color:#fff;padding:15px}
h1{text-align:center;color:#ff2d55}
.box{background:#1c1c1e;border-radius:15px;padding:15px;margin-bottom:15px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:none;margin:8px 0;background:#2c2c2e;color:#fff;font-size:16px}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#ff2d55;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.videoBox{width:100%;aspect-ratio:9/16;background:#000;border-radius:15px;overflow:hidden;position:relative;margin-top:10px}
.videoBox img{width:100%;height:100%;object-fit:cover;animation:zoom 6s infinite alternate}
@keyframes zoom{from{transform:scale(1) translateX(0)}to{transform:scale(1.15) translateX(-10px)}}
.hug img{animation:hug 4s infinite alternate}
@keyframes hug{from{transform:scale(1)}to{transform:scale(1.08)}}
.tag{display:inline-block;background:#333;padding:5px 10px;border-radius:20px;margin:3px;font-size:13px}
#status{color:#ffd60a;text-align:center;margin:10px}
</style>
</head>
<body>

<h1>✨ Sindhi Maza Studio - Gemini AI</h1>
<p style="text-align:center">100% Free - Gemini Key سان</p>

<div class="box">
<h3>🔑 1. Gemini Key لڳايو</h3>
<input type="password" id="apiKey" placeholder="AIza... پنهنجي Key هتي پيسٽ ڪريو">
<button onclick="saveKey()" style="background:#34c759">Key محفوظ ڪريو</button>
<p id="keyStatus" style="font-size:13px;color:#aaa">Key صرف تنهنجي موبائل ۾ رهندي، ڪنهن کي نه ويندي</p>
</div>

<div class="box">
<h3>🎬 2. وڊيو ٺاهيو</h3>
<textarea id="prompt" rows="2" placeholder="مثال: Sindhi Munda Dadu me dance kare payo"></textarea>
<select id="effect">
<option value="">Effect چونڊيو - Hug</option>
<option value="hug">❤️ Hug Effect</option>
<option value="">💃 Dance Effect</option>
<option value="">😘 Kiss Effect</option>
<option value="">🎉 Celebration</option>
</select>
<button id="genBtn" onclick="generate()">✨ Generate Video - Free</button>
<p id="status"></p>
<div class="videoBox" id="videoBox">
<p style="text-align:center;padding-top:120px;color:#888">هتي تنهنجي وڊيو ايندي</p>
</div>
</div>

<div class="box">
<h3>📁 My Videos</h3>
<div id="myVideos"></div>
</div>

<script>
let myVideos = JSON.parse(localStorage.getItem('myVideos')||'[]');
showVideos();

function saveKey(){
  let k = document.getElementById('apiKey').value.trim();
  if(!k){ alert('پهرين Key پيسٽ ڪريو'); return; }
  localStorage.setItem('geminiKey', k);
  document.getElementById('keyStatus').innerText = '✅ Key محفوظ ٿي وئي! هاڻي وڊيو ٺاهي سگهين ٿو';
  alert('Key محفوظ ٿي وئي!');
}
if(localStorage.getItem('geminiKey')){
  document.getElementById('apiKey').value = localStorage.getItem('geminiKey');
  document.getElementById('keyStatus').innerText = '✅ Key اڳ ۾ ئي لڳل آهي';
}

async function generate(){
  let key = localStorage.getItem('geminiKey');
  if(!key){ alert('پهرين مٿي Gemini Key لڳايو!'); return; }
  let prompt = document.getElementById('prompt').value.trim();
  if(!prompt) prompt = 'Sindhi boy dancing in Dadu, Sindh';
  let btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('status').innerText = '⏳ Gemini Prompt ٺاهي رهيو آهي...';

  let enhanced = prompt;
  try{
    let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{parts:[{text:`Make this a beautiful cinematic AI video prompt in English, 1 line: ${prompt} in Sindh, Pakistan, colorful, realistic`}]}]})
    });
    let data = await res.json();
    if(data.candidates && data.candidates[0].content.parts[0].text){
      enhanced = data.candidates[0].content.parts[0].text;
    }
  }catch(e){ console.log(e); }

  document.getElementById('status').innerText = '🎬 وڊيو ٺهي رهي آهي...';
  let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhanced)}?width=720&height=1280&seed=${Date.now()}&nologo=true`;
  
  let effect = document.getElementById('effect').value;
  let box = document.getElementById('videoBox');
  box.className = 'videoBox ' + effect;
  box.innerHTML = `<img src="${imgUrl}" onload="document.getElementById('status').innerText='✅ وڊيو تيار آهي! Gemini سان ٺهي!'">`;
  
  myVideos.unshift({prompt: enhanced, img: imgUrl, time: new Date().toLocaleString()});
  localStorage.setItem('myVideos', JSON.stringify(myVideos.slice(0,10)));
  showVideos();
  btn.disabled = false;
}

function showVideos(){
  let div = document.getElementById('myVideos');
  if(myVideos.length==0){ div.innerHTML='اڃا ڪا وڊيو ناهي'; return; }
  div.innerHTML = myVideos.map(v=>`<div style="display:flex;gap:10px;margin-bottom:10px;background:#2c2c2e;padding:8px;border-radius:10px"><img src="${v.img}" style="width:60px;height:90px;object-fit:cover;border-radius:8px"><div><b>${v.prompt.slice(0,60)}</b><br><small>${v.time}</small><br><a href="${v.img}" download style="color:#ff2d55">Download</a></div></div>`).join('');
}
</script>
</body>
</html>
